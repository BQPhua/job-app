// Manual onboarding reminder (hired candidates who haven't finished)
// ---------------------------------------------------------------------------
const needsOnboardingReminder = (a) => a && a.status === 'hired' && a.onboarding_status !== 'completed';
async function sendOnboardingReminder(id){
  const row = applications.find(x => x.id === id) || selectedApp || {};
  const ok = window.confirm(`Send an onboarding reminder email to ${row.name_nric || 'this candidate'}${row.email ? ` (${row.email})` : ''}?`);
  if(!ok) return;
  showLoading('Sending reminder...');
  const { data, error } = await apiTry(() => api.post(`/admin/applications/${id}/onboarding-reminder`, {}, {admin: true}));
  hideLoading();
  if(error){ uiToast(error.message, 'err'); return; }
  const r = applications.find(x => x.id === id);
  if(r) Object.assign(r, data);
  if(selectedApp && selectedApp.id === id) Object.assign(selectedApp, data);
  uiToast('Reminder sent to the candidate.');
  render();
}
async function bulkOnboardingReminder(){
  const ids = applications.filter(a => selectedIds.has(a.id) && needsOnboardingReminder(a)).map(a => a.id);
  if(!ids.length){ uiToast('None of the selected candidates have onboarding to complete.', 'err'); return; }
  if(!window.confirm(`Send an onboarding reminder to ${ids.length} hired candidate${ids.length===1?'':'s'}?`)) return;
  showLoading('Sending reminders...');
  const { data, error } = await apiTry(() => api.post('/admin/onboarding-reminders', { application_ids: ids }, {admin: true}));
  hideLoading();
  if(error){ uiToast(error.message, 'err'); return; }
  uiToast(`${data.sent} reminder${data.sent===1?'':'s'} sent.${data.skipped.length ? ` ${data.skipped.length} skipped (${[...new Set(data.skipped.map(x=>x.reason))].join('; ')}).` : ''}`);
  await loadApplications();
}

async function saveEdit(){
  const buEl = document.getElementById('editBusinessUnit');
  const patch = {
    position_applying: document.getElementById('editPosition').value.trim(),
    name_nric: document.getElementById('editName').value.trim(),
    email: document.getElementById('editEmail').value.trim(),
    mobile_phone: document.getElementById('editMobile').value.trim()
  };
  if(buEl) patch.business_unit = buEl.value; // only present for ALL-scope admins
  try{
    const { error } = await apiTry(() => api.patch(`/admin/applications/${selectedApp.id}`, patch, {admin: true}));
    if(error) throw error;
    editingApp = false;
    await openDetail(selectedApp.id);
    await loadApplications();
  } catch(e){ uiToast('Error saving: '+e.message); }

async function updateStatus(status){
  const label = STATUS_LABELS[status] || status;
  const warnMsg = status === 'blacklisted'
    ? 'Blacklist this candidate? They will be signed out immediately and blocked from logging in or applying again using this email. This can be reversed later by changing their status.'
    : `Change this application's status to "${label}"? The candidate will be notified by email.`;
  if(!confirm(warnMsg)) return;
  try{
    const { error } = await apiTry(() => api.post(`/admin/applications/${selectedApp.id}/status`, {status}, {admin: true}));
    if(error) throw error;
    await openDetail(selectedApp.id);
    await Promise.all([loadApplications(), loadStats()]);
  } catch(e){ uiToast('Error: '+e.message); }
}

// ============================================================================
// ONBOARDING / STATUTORY DETAILS VIEW (post-hire forms)
// ============================================================================
let onboardingData = null;
let onboardingAppInfo = null; // basic application record (name/reference) for the onboarding
// modal's header + PDF export — deliberately kept separate from `selectedApp`,
// since that variable also controls whether the full detail modal re-opens
// on every render() and whether the 20s auto-refresh poll pauses. Reusing
// it here would silently pop open the detail modal and freeze the
// dashboard's auto-refresh any time someone views onboarding without
// having opened the detail modal first.

async function openOnboardingView(applicationId){
  try{
    const needsAppFetch = !(selectedApp && selectedApp.id === applicationId);
    const [obRes, appRes] = await Promise.all([
      apiTry(() => api.get(`/admin/applications/${applicationId}/onboarding`, {admin: true})),
      needsAppFetch
        ? apiTry(() => api.get(`/admin/applications/${applicationId}`, {admin: true}))
        : Promise.resolve({ data: selectedApp, error: null })
    ]);
    if(obRes.error) throw obRes.error;
    if(appRes.error) throw appRes.error;
    // Spouse/children now live on the application (2026-10-14); older
    // onboarding records keep their own copy, used when the application has none.
    const app = appRes.data || {};
    onboardingData = obRes.data ? { ...obRes.data } : null;
    if(onboardingData){
      ['spouse_name','spouse_nric','spouse_date_of_birth','spouse_working','children_below_18','children_18_to_23'].forEach(k => {
        const v = app[k];
        if(v != null && v !== '' && !(Array.isArray(v) && !v.length)) onboardingData[k] = v;
      });
    }
    onboardingAppInfo = app;
    renderOnboardingModal();
  } catch(e){ uiToast('Error loading onboarding details: '+e.message); }
}
function closeOnboardingModal(){
  onboardingData = null;
  onboardingAppInfo = null;
  const existing = document.getElementById('onboardingModalRoot');
  if(existing) existing.remove();
}

function renderOnboardingModal(){
  const existing = document.getElementById('onboardingModalRoot');
  if(existing) existing.remove();
  const o = onboardingData;
  if(!o){
    uiToast('No onboarding record found for this candidate yet — they may not have started it.');
    return;
  }

  const div = document.createElement('div');
  div.id = 'onboardingModalRoot';
  div.className = 'modal-overlay';
  div.style.zIndex = '70';
  div.onclick = (e)=>{ if(e.target===div) closeOnboardingModal(); };

function exportOnboardingPdf(){
  if(!onboardingData || !onboardingAppInfo){ uiToast('No onboarding data loaded.'); return; }
  const html = buildOnboardingPdfHtml(onboardingAppInfo, onboardingData);
  const win = window.open('', '_blank');
  if(!win){ uiToast('Please allow pop-ups for this site to generate the PDF.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.onload = () => setTimeout(() => win.print(), 400);
}

// ============================================================================
// PDF EXPORT — formal, print-ready HTML replica, saved via the browser's
// own "Print > Save as PDF" — no third-party service, no cost. Merges the
// Job Application and PDPA Notice into one document, each as its own page,
// in whichever language the candidate chose.
// ============================================================================
function fmt(v){ return (v===null||v===undefined||v==='') ? '—' : esc(String(v)); }
function fmtDate(v){ if(!v) return '—'; try{ return new Date(v).toLocaleDateString('en-GB'); }catch(e){ return esc(v); } }
function fmtDateTime(v){ if(!v) return '—'; try{ return new Date(v).toLocaleString('en-GB'); }catch(e){ return esc(v); } }

async function exportCandidatePdf(id){
  let a = applications.find(x=>x.id===id);
  if(!a || (selectedApp && a.id !== selectedApp.id)){
    try{
      const { data, error } = await apiTry(() => api.get(`/admin/applications/${id}`, {admin: true}));
      if(error) throw error;
      a = data;
    } catch(e){ uiToast('Could not load record for export: '+e.message); return; }
  }
  // Family details on older records live in the onboarding record.
  let onboarding = null;
  if(a.status === 'hired'){
    const { data: obRec } = await apiTry(() => api.get(`/admin/applications/${a.id}/onboarding`, {admin: true}));
    onboarding = obRec || null;
  }
  WCT.openPrint(WCT.applicationPdfHtml(a, { statusLabel: STATUS_LABELS[a.status], onboarding }));
}


// ============================================================================
// BOOT
// ============================================================================
// Deep link from an email — admin.html?app=<application id> opens straight
// into that application's detail modal (e.g. "an employee has submitted
// their Exit Interview — click to review and sign") instead of the generic
// dashboard. Same idea as index.html's ?onboarding=/?exit= links. Stripped
// from the URL immediately so refreshing afterward doesn't keep re-opening
// the same modal, and consumed once whichever of boot-with-existing-session
// or doLogin() runs first actually has a token to fetch with.
let deepLinkAppId = new URLSearchParams(window.location.search).get('app');
// ?offboarding=<case id> — links in offboarding emails (clearance tasks,
// reminders, payroll) open that case's drawer right after sign-in.
let deepLinkOffboardingId = new URLSearchParams(window.location.search).get('offboarding');
if(deepLinkAppId || deepLinkOffboardingId) window.history.replaceState({}, '', window.location.pathname);
async function openDeepLinkedAppIfAny(){
  if(!deepLinkAppId) return;
  const id = deepLinkAppId;
  deepLinkAppId = null;
  await openDetail(id);
}

// After sign-in (or on reload with a saved session): learn this session's
// roles first. HR sessions load the job-application dashboard as before;
// Payroll PIC / Clearance PIC / superior sessions go straight to
// Offboarding, since every job-application endpoint refuses them.
async function startSignedInSession(){
  await Promise.all([WCT.loadBusinessUnits(), loadMyUnits()]);
  await obLoadMeta();
  liveStart();
  if(!obIsHr() || deepLinkOffboardingId){
    await setView('offboarding');
  } else {
    render();
    await loadEverything();
    obLoadTasks();
    await openDeepLinkedAppIfAny();
  }
  if(deepLinkOffboardingId){
    const id = deepLinkOffboardingId;
    deepLinkOffboardingId = null;
    await obOpenCase(id);
  }
  if(window.WXA) WXA.maybeStartTour();
}

if(adminToken && isBuScope(adminScope)) filterBusinessUnit = adminScope;
render();
if(adminToken) startSignedInSession().then(loadCurrentUserProfile);

// ============================================================================
// Microsoft sign-in no longer has a persistent Supabase Auth session to
// restore or an onAuthStateChange event to listen for — MSAL.js (oauth.js)
// gets the ID token via a popup and attemptAdminBootstrap() is called
// directly from doMicrosoftLogin() the moment that happens. The only thing
// that needs restoring across page loads is the plain admin JWT string,
// which is already loaded from localStorage into `adminToken` at the top of
// this script (via api.getAdminToken()) and handled by the `if(adminToken)`
// check above — so there's nothing left to do here.
// ============================================================================

window.addEventListener('resize', () => {
  // Crossing the mobile breakpoint mid-session (rotating a tablet, resizing
  // a desktop window) shouldn't leave the drawer stuck open over a now-wide
  // layout.
  if(!isMobileViewport() && sidebarMobileOpen){ sidebarMobileOpen = false; renderSidebarChrome(); }
});

// ============================================================================
// AUTO-REFRESH — polls every 20 seconds while on the Home view, so new
// submissions and status changes appear without needing a manual refresh.
// ============================================================================
setInterval(() => {
  if(LIVE.state === 'live') return; // live updates are on; this poll is only the fallback
  if(adminToken && currentView === 'home' && !selectedApp){
    loadApplications();
    loadStats();
  }
  // Offboarding: refresh quietly unless a case/modal is open or the user is
  // typing in the toolbar (so nothing moves under their cursor).
  if(adminToken && currentView === 'offboarding' && !OB.drawer && !document.getElementById('obModal')
     && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('.ob-toolbar'))){
    obLoadTasks().then(() => { if(OB.view === 'all') obLoadList(); else obRenderResults(); });
  }
}, 20000);
</script>
