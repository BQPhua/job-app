<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCT Group — HR Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#101B2D;
    --navy-2:#1C2C44;
    --accent:#3E5C76;
    --accent-dark:#2C4356;
    --accent-tint:#EAF0F5;
    --cream:#F6F6F5;
    --paper:#FFFFFF;
    --ink:#17181A;
    --ink-soft:#6B6D70;
    --line:#E5E5E4;
    --danger:#C0392B;
    --danger-tint:#FBEAE8;
    --ok:#1E7A46;
    --ok-tint:#E7F5EC;
    --warn:#B9770E;
    --warn-tint:#FDF3E3;
    --info:#2E5AAC;
    --info-tint:#EAF0FB;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(10,10,10,.06);
    --shadow-md:0 4px 14px rgba(10,10,10,.10);
    --shadow-lg:0 10px 30px rgba(10,10,10,.16);
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);}
  h1,h2,h3{font-family:'Source Serif 4',serif;color:var(--navy);margin:0 0 .3em;}
  a{color:var(--info);}

  .topbar{background:var(--navy);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:var(--shadow-md);}
  .topbar .brand{display:flex;align-items:center;gap:12px;}
  .topbar .sub{font-size:12.5px;color:#B9B9B9;letter-spacing:.02em;}
  .admin-nav{display:flex;gap:4px;margin-left:18px;padding-left:18px;border-left:1px solid #333;}
  .admin-nav a{color:#C9C9C9;font-size:13.5px;font-weight:600;text-decoration:none;padding:7px 14px;border-radius:7px;cursor:pointer;transition:background .15s ease, color .15s ease;}
  .admin-nav a:hover{background:#1F1F1F;color:#fff;}
  .admin-nav a.active{background:#fff;color:var(--navy);}

  .wrap{max-width:1360px;margin:0 auto;padding:24px 24px 60px;}

  /* ---------- Buttons: real interactivity, not stickers ---------- */
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;
    padding:9px 16px;border-radius:8px;border:1px solid transparent;
    cursor:pointer;transition:transform .08s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    display:inline-flex;align-items:center;gap:6px;line-height:1.2;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);box-shadow:none;}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#a32e21;}
  .btn-success{background:var(--ok);color:#fff;}
  .btn-success:hover{background:#155e35;}
  .btn-shortlist{background:#C99A2E;color:#fff;}
  .btn-shortlist:hover{background:#A87F22;}
  .btn-blacklist{background:#1a1a1a;color:#fff;}
  .btn-blacklist:hover{background:#000;}
  .btn-offboarding{background:#6B6D70;color:#fff;}
  .btn-offboarding:hover{background:#54524F;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-outline{background:#fff;color:var(--navy);border-color:var(--line);}
  .btn-outline:hover{background:var(--cream);border-color:#C9C9C8;}
  .btn-outline-danger{background:#fff;color:var(--danger);border-color:#EBC3BD;}
  .btn-outline-danger:hover{background:var(--danger-tint);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-icon{padding:7px 9px;}

  /* ---------- Layout pieces ---------- */
  .stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:110px;box-shadow:var(--shadow-sm);transition:border-color .15s ease,box-shadow .15s ease;}
  .stat:hover{border-color:var(--accent);box-shadow:var(--shadow-md);}
  .stat.stat-active{border-color:var(--navy);border-width:2px;box-shadow:var(--shadow-md);}
  .stat .n{font-size:24px;font-weight:700;color:var(--navy);font-family:'Source Serif 4',serif;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  .toolbar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text], .toolbar select{
    font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  }
  .toolbar input[type=text]{flex:1;min-width:220px;}
  .toolbar select{width:auto;}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  /* overflow:hidden used to be here to make the border-radius show on the
     table's corners, but that also clipped the status-panel dropdown
     (position:absolute, extends past the table's own box) — replicate the
     same rounded-corner look without clipping child content instead. */
  thead tr:first-child th:first-child{border-top-left-radius:var(--radius);}
  thead tr:first-child th:last-child{border-top-right-radius:var(--radius);}
  tbody tr:last-child td:first-child{border-bottom-left-radius:var(--radius);}
  tbody tr:last-child td:last-child{border-bottom-right-radius:var(--radius);}
  th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.data-row:hover{background:#FAFAF9;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .badge.submitted{background:var(--info-tint);color:var(--info);}
  .badge.under_review{background:var(--warn-tint);color:var(--warn);}
  .badge.shortlisted{background:#FFF3D6;color:#8A6D1F;}
  .badge.interview_scheduled{background:#EEE8FB;color:#6A3FC0;} /* historical only, no longer selectable */
  .badge.offer_sent{background:#FCEFE0;color:#B9660E;} /* historical only, no longer selectable */
  .badge.kiv{background:var(--warn-tint);color:var(--warn);}
  .badge.offboarding{background:#E4E4E3;color:#54524F;}
  .badge.rejected{background:var(--danger-tint);color:var(--danger);}
  .badge.hired{background:var(--ok-tint);color:var(--ok);}
  .badge.withdrawn{background:#EDEDEC;color:var(--ink-soft);}
  .badge.blacklisted{background:#1a1a1a;color:#fff;}

  .status-panel{
    position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow-md);z-index:15;min-width:160px;padding:4px;
  }
  .status-panel-btn{
    display:block;width:100%;text-align:left;padding:8px 10px;font-family:inherit;font-size:12.5px;font-weight:600;
    background:none;border:none;border-radius:6px;cursor:pointer;color:var(--ink);
  }
  .status-panel-btn:hover{background:var(--cream);}
  .status-panel-btn.current{color:var(--accent);}

  .pagination{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-soft);}
  .pagination .controls{display:flex;gap:6px;align-items:center;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:var(--radius);}

  img.pfp,.pfp{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eee;flex-shrink:0;}
  .pfp-placeholder{display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:700;font-size:16px;font-family:'Source Serif 4',serif;}
  .name-cell{display:flex;align-items:center;gap:10px;}
  .row-check{width:16px;height:16px;cursor:pointer;accent-color:var(--navy);}
  tr.row-selected td{background:var(--accent-tint);}
  tr.row-selected:hover td{background:var(--accent-tint);}

  .bulk-toolbar{
    background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-md);
    animation:bulkIn .15s ease;
  }
  @keyframes bulkIn{ from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
  .bulk-toolbar .bulk-count{font-weight:700;font-size:13.5px;margin-right:auto;}
  .bulk-toolbar select{font-family:inherit;font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--navy);}
  .bulk-toolbar .btn-accent,
  .bulk-toolbar .btn-outline{background:#fff;color:var(--navy);border-color:#fff;}
  .bulk-toolbar .btn-accent:hover,
  .bulk-toolbar .btn-outline:hover{background:var(--cream);}
  .bulk-toolbar .bulk-clear{opacity:.85;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
  .modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:32px;box-shadow:var(--shadow-lg);}
  .modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .detail-section{margin-bottom:18px;}
  .detail-section h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0 0 8px;border-top:1px solid var(--line);padding-top:14px;}
  .detail-section:first-of-type h4{border-top:none;padding-top:0;}
  .drow{display:flex;font-size:13.5px;padding:3px 0;}
  .drow .k{width:42%;color:var(--ink-soft);}
  .drow .v{width:58%;font-weight:500;}
  .status-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--navy);}
  .field input, .field select{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;}

  /* Offboarding — HR sign-off box on the Exit Interview section. Plain,
     self-contained styling (not reusing a candidate-side class) since
     admin.html and index.html deliberately keep separate smaller CSS sets —
     see the class-mismatch trap noted elsewhere in this file's history. */
  .sign-checkbox-row{display:flex;align-items:flex-start;gap:10px;background:#FAFAF9;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;}
  .sign-checkbox-row input{margin-top:3px;}
  .exit-reason-chip{display:inline-block;background:var(--accent-tint);color:var(--accent-dark);border-radius:14px;padding:3px 10px;font-size:11.5px;margin:2px 4px 2px 0;}

  /* Clean, styled <select> — used wherever a plain browser-default dropdown
     (e.g. Company/Entity assignment) needs to match the rest of the design
     system instead of looking like unstyled OS chrome. */
  .select-clean{
    font-family:inherit;font-size:13.5px;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B6D70'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;
  }
  .select-clean:hover{border-color:#C9C9C8;}
  .select-clean:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}

  .loading-overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);display:flex;align-items:center;justify-content:center;z-index:99;color:#fff;font-weight:600;}
  .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .login-wrap{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px;text-align:center;box-shadow:var(--shadow-md);}
  .login-wrap input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-tint);
}
  .pw-toggle-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line);border-radius:7px;
    color:var(--ink-soft);cursor:pointer;padding:0;transition:background .15s ease,color .15s ease;
  }
  .pw-toggle-btn:hover{background:var(--cream);color:var(--navy);}
  /* Some browsers (Edge, some Safari versions) inject their own built-in
     password reveal/clear icon on the right edge of a password field. We
     already have a custom show/hide button positioned there, so suppress
     the native one everywhere it can appear — otherwise the two icons
     visually stack on top of each other. */
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear{ display:none; }
  input[type="password"]::-webkit-textfield-decoration-container{ visibility:hidden; }
  input[type="password"]::-webkit-credentials-auto-fill-button,
  input[type="password"]::-webkit-contacts-auto-fill-button{ display:none !important; visibility:hidden; pointer-events:none; position:absolute; right:0; }
  .error-banner{background:var(--danger-tint);border:1px solid #EBC3BD;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;}
  .success-banner{background:var(--ok-tint);border:1px solid #BEDACB;color:var(--ok);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;}

  /* ==========================================================================
     MOBILE — additive only; every rule above this block is untouched, so
     the desktop dashboard layout doesn't change at all.
     ========================================================================== */
  @media(max-width:820px){
    .topbar{padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
    .topbar .brand{flex-wrap:wrap;row-gap:6px;}
    .admin-nav{margin-left:0;padding-left:0;border-left:none;flex-wrap:wrap;}
    .topbar .sub{display:none;} /* "WCT Admin Dashboard" label — nav labels already make the context clear, and it's the first thing to drop for space */

    .wrap{padding:14px 10px 40px;}

    .stat-row{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .stat{min-width:118px;}

    /* Toolbar: stack search/filters/buttons full-width instead of
       squeezing them into one row that wraps unpredictably. */
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar input[type=text], .toolbar select{width:100%;}

    .bulk-toolbar{flex-direction:column;align-items:stretch;}
    .bulk-toolbar .bulk-count{margin-right:0;}
    .bulk-toolbar select{width:100%;}

    /* The applications table has 8 columns — no reasonable way to reflow
       that to a single column without a completely different mobile-only
       template, so let it scroll horizontally instead of squashing. */
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}

    .pagination{flex-direction:column;align-items:flex-start;gap:8px;}

    .modal-overlay{padding:16px 8px;}
    .modal{padding:20px;}
    .drow{flex-direction:column;padding:6px 0;}
    .drow .k, .drow .v{width:100%;}
    .drow .k{font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
    .status-actions{gap:6px;}
    .status-actions .btn{flex:1;min-width:120px;}

    .login-wrap{margin:40px auto;padding:26px 20px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img class="wct-logo-img" alt="WCT Group" style="height:32px;background:#fff;border-radius:5px;padding:3px 8px;">
    <span class="sub">WCT Admin Dashboard</span>
    <nav class="admin-nav" id="adminNav"></nav>
  </div>
  <div id="logoutArea"></div>
</div>

<div id="root"></div>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <div id="loadingText">Working...</div>
  </div>
</div>

<script src="config.js"></script>
<script src="logo.js"></script>
<script>document.querySelectorAll('.wct-logo-img').forEach(el=>el.src=WCT_LOGO_DATA_URI);</script>
<script>
// ============================================================================
// STATE
// ============================================================================
let adminToken = sessionStorage.getItem('wct_admin_token');
let adminScope = sessionStorage.getItem('wct_admin_scope');
let applications = [];
let totalCount = 0;
let stats = { total: 0, by_status: {} };
let selectedApp = null;
let editingApp = false;
let currentView = 'home';
let searchTerm = '';
let filterBusinessUnit = '';
let filterStatus = '';
let currentPage = 1;
const PAGE_SIZE = 20;
let searchDebounceTimer = null;
let selectedIds = new Set(); // batch management — ids checked on the current page
let openStatusPanelId = null; // which row's status button panel is currently open (only one at a time)

// ---------------------------------------------------------------------------
// Small consistent icon set for row/table actions — replaces mixed emoji so
// the action column reads as one deliberate button group instead of ad-hoc
// symbols, and so every row always renders the same number of buttons
// (disabled instead of removed) rather than the layout shifting per row.
// ---------------------------------------------------------------------------
const ICON_VIEW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_PDF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>';
const ICON_ONBOARD = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>';
const ICON_DELETE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>';
const ICON_MAIL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7"/></svg>';
const ICON_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_EYE_OPEN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_CLOSED = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.61 6.61A18.42 18.42 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"/><path d="M1 1l22 22"/></svg>';

function rowActionsHtml(a){
  const isHired = a.status === 'hired';
  const mailtoHref = `mailto:${encodeURIComponent(a.email||'')}?subject=${encodeURIComponent('Regarding your application '+a.reference_no)}&body=${encodeURIComponent('Dear '+(a.name_nric||'Candidate')+',\n\n')}`;
  return `
    <div class="row-actions">
      <button class="btn btn-outline btn-icon" title="View details" onclick="openDetail('${a.id}')">${ICON_VIEW}</button>
      <button class="btn btn-outline btn-icon" title="Export PDF" onclick="exportCandidatePdf('${a.id}')">${ICON_PDF}</button>
      <button class="btn btn-icon ${isHired ? 'btn-accent' : 'btn-outline'}" title="${isHired ? 'Onboarding Details' : 'Onboarding Details — available once Hired'}" ${isHired ? `onclick="openOnboardingView('${a.id}')"` : 'disabled'}>${ICON_ONBOARD}</button>
      <a class="btn btn-outline btn-icon" title="Email candidate" href="${mailtoHref}">${ICON_MAIL}</a>
      <button class="btn btn-outline-danger btn-icon" title="Delete" onclick="confirmDelete('${a.id}', '${esc(a.name_nric)}')">${ICON_DELETE}</button>
    </div>
  `;
}

const STATUS_LABELS = {
  submitted:'New', under_review:'Under Review', shortlisted:'Shortlisted',
  // interview_scheduled, offer_sent, under_review, and withdrawn are no
  // longer selectable (removed from STATUS_OPTIONS below) but stay mapped
  // here so any existing historical record still in one of those statuses
  // displays its label correctly instead of showing "undefined".
  interview_scheduled:'Interview Scheduled', offer_sent:'Offer Sent', withdrawn:'Withdrawn',
  kiv:'Keep In View', hired:'Hired', offboarding:'Offboarding', rejected:'Rejected', blacklisted:'Blacklisted'
};
const STATUS_OPTIONS = ['shortlisted','kiv','hired','offboarding','rejected','blacklisted'];
// 'offboarding' is intentionally NOT routed through rpc_admin_update_status —
// see rpc_admin_set_offboarding in add_offboarding_exit_interview.sql for why.
// quickUpdateStatus/updateStatus/applyBulkStatus below all branch on this.
const STATUS_VIA_DEDICATED_RPC = { offboarding: 'rpc_admin_set_offboarding' };

// Fixed reason checkboxes from the paper "Employee Exit Interview Form" —
// order matches the two printed columns exactly, so a PDF export or a
// two-column render can reproduce the original layout. Kept in this same
// order/wording in app.js too (duplicated rather than shared, per this
// project's no-build-step, no-shared-module setup).
const EXIT_REASONS_LEFT = ['Compensation (Salary / Benefits)','Better Offer','Career Advancement','Lack of promotional opportunities','Lack of training','Working Hours'];
const EXIT_REASONS_RIGHT = ['Conflict with colleague/superior','Relocation','Retirement','Health','Return to Study','Distance travelled to work'];

function esc(v){ if(v===null||v===undefined) return ''; return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showLoading(text){ document.getElementById('loadingText').innerText = text||'Working...'; document.getElementById('loadingOverlay').style.display='flex'; }
function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }

// ============================================================================
// RENDER DISPATCH
// ============================================================================
// `lastRenderedView` lets us tell the difference between "navigating into
// the Home view" (needs the full shell — stat cards, toolbar, search input —
// rebuilt) and "data on the Home view changed" (only the results table/stats
// need updating). Previously every keystroke in the search box triggered a
// full teardown-and-rebuild of the whole dashboard, including the search
// input itself — that's what caused the lag and the cursor jumping back
// (the old fix tried to manually restore focus/cursor position after the
// rebuild, but that's fighting the real problem instead of avoiding it).
// Now the search input's DOM node is never touched by a data refresh, so
// the browser's own text-cursor handling just works, with nothing to fix.
// ============================================================================
let lastRenderedView = null;

function render(){
  const root = document.getElementById('root');
  document.getElementById('logoutArea').innerHTML = adminToken
    ? `<button class="btn btn-outline btn-sm" onclick="logout()">Log out</button>` : '';
  const navEl = document.getElementById('adminNav');
  if(navEl){
    navEl.innerHTML = adminToken ? `
      <a class="${currentView==='home'?'active':''}" onclick="setView('home')">Home</a>
      <a class="${currentView==='companies'?'active':''}" onclick="setView('companies')">Company Settings</a>
      ${adminScope==='ALL' ? `<a class="${currentView==='permissions'?'active':''}" onclick="setView('permissions')">Permission Settings</a>` : ''}
      ${adminScope==='ALL' ? `<a class="${currentView==='settings'?'active':''}" onclick="setView('settings')">Manager Settings</a>` : ''}
    ` : '';
  }
  if(!adminToken){ root.innerHTML = loginView(); lastRenderedView = null; return; }

  if(currentView === 'home'){
    if(lastRenderedView !== 'home' || !document.getElementById('dashResults')){
      root.innerHTML = `<div class="wrap">${dashboardShellHtml()}</div>`;
      lastRenderedView = 'home';
    } else {
      renderDashboardResults();
    }
  } else if(currentView === 'companies'){
    // Same shell-vs-results split as Home: rebuilding the whole page on
    // every search keystroke would blow away focus/cursor position in the
    // search input (see the note on `lastRenderedView` above).
    if(lastRenderedView !== 'companies' || !document.getElementById('companyMgmtResults')){
      root.innerHTML = `<div class="wrap">${companySettingsPageView()}</div>`;
      lastRenderedView = 'companies';
    } else {
      renderCompanyMgmtResults();
    }
  } else {
    let pageContent;
    if(currentView==='settings') pageContent = settingsPageView();
    else if(currentView==='permissions') pageContent = permissionsPageView();
    root.innerHTML = `<div class="wrap">${pageContent}</div>`;
    lastRenderedView = currentView;
  }
  if(selectedApp) renderModal();
}
async function setView(view){
  currentView = view;
  if(view==='settings'){ await loadSettingsForPage(); }
  if(view==='permissions'){ await loadPermissionsForPage(); }
  if(view==='companies'){ companyMgmtAddOpen = false; companyMgmtEditId = null; companyMgmtSearch = ''; await loadCompanyMgmtList(); }
  render();
}

// LOGIN
// ============================================================================
function loginView(){
  return `
    <div class="login-wrap">
      <h2>Admin Login</h2>
      <p style="color:var(--ink-soft);font-size:13px;">Enter the HR admin passcode to view applications.</p>
      <div class="field" style="margin-top:14px;text-align:left;">
        <label>Admin Passcode <span style="color:var(--danger);">*</span></label>
        <div style="position:relative;">
          <input type="password" id="passcodeInput" placeholder="Enter passcode" autocomplete="off" data-lpignore="true" data-1p-ignore style="padding-right:44px;margin-top:0;" onkeydown="if(event.key==='Enter') doLogin()">
          <button type="button" id="passcodeToggleBtn" class="pw-toggle-btn" onclick="togglePasscodeVisibility()" title="Show passcode" aria-label="Show passcode">${ICON_EYE_OPEN}</button>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px;" onclick="doLogin()">Log In</button>
      <div id="loginErr"></div>

    </div>
  `;
}
function togglePasscodeVisibility(){
  const el = document.getElementById('passcodeInput');
  const btn = document.getElementById('passcodeToggleBtn');
  const showing = el.type === 'password';
  el.type = showing ? 'text' : 'password';
  btn.innerHTML = showing ? ICON_EYE_CLOSED : ICON_EYE_OPEN;
  btn.title = showing ? 'Hide passcode' : 'Show passcode';
  btn.setAttribute('aria-label', btn.title);
}
async function doLogin(){
  const pass = document.getElementById('passcodeInput').value;
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_login', { p_passcode: pass });
    if(error) throw error;
    adminToken = data[0].token;
    adminScope = data[0].unit_scope;
    sessionStorage.setItem('wct_admin_token', adminToken);
    sessionStorage.setItem('wct_admin_scope', adminScope);
    if(adminScope !== 'ALL') filterBusinessUnit = adminScope;
    render();
    await loadEverything();
    await openDeepLinkedAppIfAny();
  } catch(e){
    document.getElementById('loginErr').innerHTML = `<div class="error-banner">Incorrect passcode.</div>`;
  }
}
function logout(){ sessionStorage.removeItem('wct_admin_token'); sessionStorage.removeItem('wct_admin_scope'); adminToken=null; adminScope=null; render(); }

// ============================================================================
// DASHBOARD: shell (search/filters — built once) + results (rebuilt on
// every data refresh, e.g. search typing, filter change, page change,
// status update, delete, the 20s auto-poll). Splitting these apart is what
// fixes the search box lag/cursor-jump — see the note above render().
// ============================================================================
function dashboardShellHtml(){
  return `
    <div id="pendingSignatureBanner">${pendingSignatureBannerHtml()}</div>
    <div class="stat-row" id="dashStats">${statRowHtml()}</div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by name, reference no., email, or phone..." value="${esc(searchTerm)}" oninput="handleSearchInput(this.value)">
      ${adminScope === 'ALL' ? `
        <select onchange="setFilter('business_unit', this.value)">
          <option value="">All Business Units</option>
          <option value="E&C" ${filterBusinessUnit==='E&C'?'selected':''}>E&amp;C</option>
          <option value="Land" ${filterBusinessUnit==='Land'?'selected':''}>Land</option>
          <option value="Mall" ${filterBusinessUnit==='Mall'?'selected':''}>Mall</option>
        </select>
      ` : `<span class="badge" style="background:var(--navy);color:#fff;">${esc(adminScope)} ACCESS ONLY</span>`}
      <select id="statusFilterSelect" onchange="setFilter('status', this.value)">
        <option value="">All Statuses</option>
        <option value="submitted" ${filterStatus==='submitted'?'selected':''}>New</option>
        ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}

// Employees can sign their own Exit Interview section without HR ever
// completing Section D — nothing else in the UI would otherwise surface an
// exit interview stuck in that state, so this banner exists specifically
// to make sure a signed-by-employee-but-not-HR record doesn't get missed.
let pendingExitSignatureCount = 0;
async function loadPendingExitSignatureCount(){
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_count_pending_exit_signatures', { p_token: adminToken });
    if(error) throw error;
    pendingExitSignatureCount = data || 0;
  } catch(e){ pendingExitSignatureCount = 0; }
}
function pendingSignatureBannerHtml(){
  if(!pendingExitSignatureCount) return '';
  return `
    <div class="error-banner" style="background:#F2F1EE;border-color:#D8D6D0;color:#54524F;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <span>⚠ ${pendingExitSignatureCount} Exit Interview${pendingExitSignatureCount===1?'':'s'} signed by the employee, awaiting your HR signature.</span>
      <button class="btn btn-outline btn-sm" style="background:#fff;" onclick="setFilter('status','offboarding')">Review Now →</button>
    </div>
  `;
}

function statRowHtml(){
  const statClick = (statusVal) => `onclick="setFilter('status', '${statusVal}')" style="cursor:pointer;"`;
  const activeCls = (statusVal) => filterStatus === statusVal ? ' stat-active' : '';
  return `
      <div class="stat${filterStatus===''?' stat-active':''}" ${statClick('')}><div class="n">${stats.total||0}</div><div class="l">Total Applicants</div></div>
      <div class="stat${activeCls('submitted')}" ${statClick('submitted')}><div class="n">${stats.by_status?.submitted||0}</div><div class="l">New</div></div>
      <div class="stat${activeCls('shortlisted')}" ${statClick('shortlisted')}><div class="n">${stats.by_status?.shortlisted||0}</div><div class="l">Shortlisted</div></div>
      <div class="stat${activeCls('kiv')}" ${statClick('kiv')}><div class="n">${stats.by_status?.kiv||0}</div><div class="l">Keep In View</div></div>
      <div class="stat${activeCls('hired')}" ${statClick('hired')}><div class="n">${stats.by_status?.hired||0}</div><div class="l">Hired</div></div>
      <div class="stat${activeCls('offboarding')}" ${statClick('offboarding')}><div class="n">${stats.by_status?.offboarding||0}</div><div class="l">Offboarding</div></div>
      <div class="stat${activeCls('rejected')}" ${statClick('rejected')}><div class="n">${stats.by_status?.rejected||0}</div><div class="l">Rejected</div></div>
  `;
}

function dashboardResultsHtml(){
  const totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
  const allOnPageSelected = applications.length>0 && applications.every(a=>selectedIds.has(a.id));

  const rows = applications.map(a => `
    <tr class="data-row ${selectedIds.has(a.id)?'row-selected':''}">
      <td><input type="checkbox" class="row-check" ${selectedIds.has(a.id)?'checked':''} onchange="toggleSelectRow('${a.id}', this.checked)"></td>
      <td>${esc(a.reference_no)}</td>
      <td>
        <div class="name-cell">
          ${a.profile_picture_url ? `<img class="pfp" src="${a.profile_picture_url}">` : `<div class="pfp pfp-placeholder">${esc((a.name_nric||'?').trim().charAt(0).toUpperCase())}</div>`}
          <div>
            <div style="font-weight:600;">${esc(a.name_nric)}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);">${esc(a.email)}</div>
          </div>
        </div>
      </td>
      <td>${esc(a.business_unit)}</td>
      <td>${a.company_id ? esc(companyNameById[a.company_id] || '—') : '<span style="color:var(--ink-soft);">—</span>'}</td>
      <td style="position:relative;">
        <span class="badge ${a.status}" style="cursor:pointer;" onclick="toggleStatusPanel('${a.id}')">${STATUS_LABELS[a.status]||a.status} ▾</span>
        ${openStatusPanelId === a.id ? `
          <div class="status-panel">
            ${STATUS_OPTIONS.map(s=>`<button class="status-panel-btn ${a.status===s?'current':''}" onclick="quickUpdateStatus('${a.id}', '${s}')">${STATUS_LABELS[s]}${a.status===s?' ✓':''}</button>`).join('')}
          </div>
        ` : ''}
      </td>
      <td>${a.submitted_at ? new Date(a.submitted_at).toLocaleDateString() : '—'}</td>
      <td>${rowActionsHtml(a)}</td>
    </tr>
  `).join('');

  return `
    ${selectedIds.size>0 ? `
    <div class="bulk-toolbar">
      <span class="bulk-count">${selectedIds.size} selected</span>
      <select id="bulkStatusSelect">
        <option value="">Change status to…</option>
        ${STATUS_OPTIONS.map(s=>`<option value="${s}">${STATUS_LABELS[s]}</option>`).join('')}
      </select>
      <button class="btn btn-accent btn-sm" onclick="applyBulkStatus()">Apply</button>
      <button class="btn btn-outline btn-sm" onclick="bulkExportCsv()">Export Selected</button>
      <button class="btn btn-danger btn-sm" onclick="bulkDelete()">Delete Selected</button>
      <button class="btn btn-outline btn-sm bulk-clear" onclick="clearSelection()">Clear</button>
    </div>
    ` : ''}

    ${applications.length===0 ? `<div class="empty-state">No applications match your search/filters.</div>` : `
      <table>
        <thead><tr>
          <th style="width:36px;"><input type="checkbox" class="row-check" ${allOnPageSelected?'checked':''} onchange="toggleSelectAll(this.checked)" title="Select all on this page"></th>
          <th>Reference</th><th>Candidate</th><th>Unit</th><th>Company</th><th>Status</th><th>Submitted</th><th>Actions</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="pagination">
        <div>Showing ${(currentPage-1)*PAGE_SIZE + 1}–${Math.min(currentPage*PAGE_SIZE, totalCount)} of ${totalCount}</div>
        <div class="controls">
          <button class="btn btn-outline btn-sm" ${currentPage<=1?'disabled':''} onclick="goToPage(currentPage-1)">← Prev</button>
          <span>Page ${currentPage} of ${totalPages}</span>
          <button class="btn btn-outline btn-sm" ${currentPage>=totalPages?'disabled':''} onclick="goToPage(currentPage+1)">Next →</button>
        </div>
      </div>
    `}
  `;
}

function renderDashboardResults(){
  const bannerEl = document.getElementById('pendingSignatureBanner');
  if(bannerEl) bannerEl.innerHTML = pendingSignatureBannerHtml();
  const statsEl = document.getElementById('dashStats');
  if(statsEl) statsEl.innerHTML = statRowHtml();
  const resultsEl = document.getElementById('dashResults');
  if(resultsEl) resultsEl.innerHTML = dashboardResultsHtml();
}

function handleSearchInput(val){
  searchTerm = val;
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => { currentPage = 1; selectedIds.clear(); openStatusPanelId = null; loadApplications(); }, 350);
}
function setFilter(key, val){
  if(key==='business_unit') filterBusinessUnit = val;
  if(key==='status'){
    filterStatus = val;
    // Keep the toolbar's own dropdown in sync — it isn't part of the shell
    // rebuild path, so if the filter changed via something other than the
    // dropdown itself (e.g. clicking a stat card), it'd otherwise go stale.
    const sel = document.getElementById('statusFilterSelect');
    if(sel) sel.value = val;
  }
  currentPage = 1;
  selectedIds.clear();
  openStatusPanelId = null;
  loadApplications();
}
function goToPage(p){ currentPage = p; selectedIds.clear(); openStatusPanelId = null; loadApplications(); }

// ---------------------------------------------------------------------------
// BATCH MANAGEMENT — selection is scoped to what's currently loaded (one
// page of results); there's no server-side "select all matching filter"
// since bulk status/delete calls loop the existing single-record RPCs
// client-side rather than requiring a new bulk RPC.
// ---------------------------------------------------------------------------
function toggleSelectRow(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  render();
}
function toggleSelectAll(checked){
  applications.forEach(a => checked ? selectedIds.add(a.id) : selectedIds.delete(a.id));
  render();
}
function clearSelection(){ selectedIds.clear(); render(); }

async function applyBulkStatus(){
  const status = document.getElementById('bulkStatusSelect').value;
  if(!status){ alert('Please choose a status to apply first.'); return; }
  const count = selectedIds.size;
  if(status === 'blacklisted' && !confirm(`Blacklist ${count} candidate(s)? They will be signed out immediately and blocked from logging in or applying again using this email.`)) return;
  if(status === 'offboarding' && !confirm(`Move ${count} application(s) to "Offboarding"? Each candidate will be prompted to complete their Exit Interview Form.`)) return;
  if(status !== 'offboarding' && !confirm(`Change status to "${STATUS_LABELS[status]}" for ${count} selected application(s)?`)) return;
  showLoading(`Updating ${count} application(s)...`);
  let failed = 0;
  const rpcName = STATUS_VIA_DEDICATED_RPC[status] || 'rpc_admin_update_status';
  for(const id of Array.from(selectedIds)){
    try{
      const params = STATUS_VIA_DEDICATED_RPC[status]
        ? { p_token: adminToken, p_id: id }
        : { p_token: adminToken, p_id: id, p_status: status };
      const { error } = await supabaseClient.rpc(rpcName, params);
      if(error) failed++;
    } catch(e){ failed++; }
  }
  selectedIds.clear();
  hideLoading();
  await Promise.all([loadApplications(), loadStats()]);
  if(failed) alert(`${failed} of ${count} update(s) failed — please check those applications individually.`);
}

async function bulkDelete(){
  const count = selectedIds.size;
  if(!confirm(`Permanently delete ${count} selected application(s)? This cannot be undone.`)) return;
  showLoading(`Deleting ${count} application(s)...`);
  let failed = 0;
  for(const id of Array.from(selectedIds)){
    try{
      const { error } = await supabaseClient.rpc('rpc_admin_delete_application', {p_token: adminToken, p_id: id});
      if(error) failed++;
    } catch(e){ failed++; }
  }
  selectedIds.clear();
  hideLoading();
  await Promise.all([loadApplications(), loadStats()]);
  if(failed) alert(`${failed} of ${count} deletion(s) failed.`);
}

async function bulkExportCsv(){
  showLoading('Preparing export of selected applications...');
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_export_all', { p_token: adminToken });
    if(error) throw error;
    const filtered = (data||[]).filter(a => selectedIds.has(a.id));
    downloadApplicationsCsv(filtered, `wct-applications-selected-export-${new Date().toISOString().slice(0,10)}.csv`);
  } catch(e){ alert('Error exporting: '+e.message); }
  hideLoading();
}

let companyNameById = {}; // for the dashboard table's Company column — fetched
// once rather than per-row, since it rarely changes.

async function loadCompanyLookup(){
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_list_companies', { p_token: adminToken });
    if(error) throw error;
    companyNameById = {};
    (data||[]).forEach(c => { companyNameById[c.id] = c.name; });
  } catch(e){ console.error('Could not load company lookup', e); }
}

async function loadEverything(){
  showLoading('Loading applications...');
  await Promise.all([loadApplications(), loadStats(), loadCompanyLookup(), loadPendingExitSignatureCount()]);
  hideLoading();
}

let searchRequestSeq = 0; // guards against a slow/stale response overwriting a newer one

async function loadApplications(){
  const mySeq = ++searchRequestSeq;
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_search_applications', {
      p_token: adminToken,
      p_search: searchTerm || null,
      p_business_unit: filterBusinessUnit || null,
      p_status: filterStatus || null,
      p_page: currentPage,
      p_page_size: PAGE_SIZE
    });
    if(error) throw error;
    if(mySeq !== searchRequestSeq) return; // a newer search/filter/page change has since started — drop this stale result
    applications = data.rows || [];
    totalCount = data.total || 0;
    render();
  } catch(e){
    if(mySeq !== searchRequestSeq) return;
    if(String(e.message||'').includes('expired')||String(e.message||'').includes('Session')){ logout(); }
    else alert('Error loading applications: '+e.message);
  }
}

async function loadStats(){
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_get_stats', { p_token: adminToken });
    if(error) throw error;
    stats = data;
    render();
  } catch(e){ console.error(e); }
}

function toggleStatusPanel(id){
  openStatusPanelId = (openStatusPanelId === id) ? null : id;
  renderDashboardResults();
}

// Registered once at script load (not per-render) — clicking anywhere that
// isn't the open panel itself or the badge that opened it closes it. Without
// this, the only way to dismiss the panel was to pick a status; there was
// no way to just cancel out of it.
document.addEventListener('click', function(e){
  if(openStatusPanelId && !e.target.closest('.status-panel') && !e.target.closest('.badge')){
    openStatusPanelId = null;
    renderDashboardResults();
  }
});

async function quickUpdateStatus(id, status){
  const label = STATUS_LABELS[status] || status;
  const warnMsg = status === 'blacklisted'
    ? 'Blacklist this candidate? They will be signed out immediately and blocked from logging in or applying again using this email.'
    : status === 'offboarding'
    ? `Move this application to "Offboarding"? The candidate will be prompted to complete their Exit Interview Form.`
    : `Change this application's status to "${label}"? The candidate will be notified by email.`;
  if(!confirm(warnMsg)){ openStatusPanelId = null; loadApplications(); return; }
  openStatusPanelId = null;
  try{
    const rpcName = STATUS_VIA_DEDICATED_RPC[status] || 'rpc_admin_update_status';
    const params = STATUS_VIA_DEDICATED_RPC[status]
      ? { p_token: adminToken, p_id: id }
      : { p_token: adminToken, p_id: id, p_status: status };
    const { error } = await supabaseClient.rpc(rpcName, params);
    if(error) throw error;
    await Promise.all([loadApplications(), loadStats()]);
  } catch(e){ alert('Error: '+e.message); loadApplications(); }
}

async function confirmDelete(id, name){
  if(!confirm(`Permanently delete ${name}'s application? This cannot be undone.`)) return;
  try{
    const { error } = await supabaseClient.rpc('rpc_admin_delete_application', {p_token: adminToken, p_id: id});
    if(error) throw error;
    await Promise.all([loadApplications(), loadStats()]);
  } catch(e){ alert('Error deleting: '+e.message); }
}

async function exportCsv(){
  showLoading('Preparing full export...');
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_export_all', { p_token: adminToken });
    if(error) throw error;
    downloadApplicationsCsv(data||[], `wct-applications-full-export-${new Date().toISOString().slice(0,10)}.csv`);
  } catch(e){ alert('Error exporting: '+e.message); }
  hideLoading();
}

function downloadApplicationsCsv(data, filename){
    const jsonCell = (v) => v ? JSON.stringify(v) : '';
    const dt = (v) => v ? new Date(v).toISOString() : '';

    const headers = [
      // -- Job Application: identity & status --
      'Reference No.','Status','Business Unit','Position Applying','Submitted At','Created At','Updated At',
      // -- Personal Particulars --
      'Name (per NRIC)','Alias','Permanent Address','Permanent Postcode','Correspondence Address','Correspondence Postcode',
      'Tel Residence','Tel Office','Mobile Phone','Email','Place of Birth',
      'NRIC No.','Passport No.','Citizen','Marital Status','Date of Birth','Age','Bumiputra','Race',
      // -- Statutory Details (as collected on the application, if any) --
      'App EPF No.','App Income Tax No.','App Tax Branch','App SOCSO No.','App Bank Account No.','App CIDB Green Card No.','App CIDB Branch',
      // -- Language / Education / Experience (JSON) --
      'Language Ability (JSON)','Education (JSON)','Working Experience (JSON)',
      // -- Employment Questions --
      'Resignation Notice Required','Notice Period','Date Available to Start','Expected Basic Salary',
      'Relatives in Company','Relatives Name','Relatives Relationship',
      'Referred by Anyone','Referral Name','Referral Department',
      'Own Transport (Car)','Own Transport (Motorcycle)','Willing Outside Klang Valley',
      'Physical Defects','Physical Defects Specify','Arrested/Convicted','Arrested/Convicted Specify',
      // -- Referees & Declarations --

      a.referral_person, a.referral_name, a.referral_department,
      a.own_transport_motorcar, a.own_transport_motorcycle, a.willing_based_outside_klang_valley,
      a.physical_defects, a.physical_defects_specify, a.arrested_convicted, a.arrested_convicted_specify,

      a.profile_picture_url, jsonCell(a.attachments), a.language_choice,
      a.jts_agreed, a.jts_agreed_name, a.jts_agreed_nric, a.jts_agreed_mobile, dt(a.jts_agreed_at),
      a.pdpa_agreed, a.pdpa_agreed_name, a.pdpa_agreed_nric, dt(a.pdpa_agreed_at),
      a.ob_status, a.ob_epf_no, a.ob_income_tax_no, a.ob_tax_branch,
      a.ob_socso_no, a.ob_bank_account_no, a.ob_cidb_green_card_no, a.ob_cidb_branch,
      a.ob_spouse_name, a.ob_spouse_nric, a.ob_spouse_date_of_birth, a.ob_spouse_working,
      jsonCell(a.ob_children_below_18), jsonCell(a.ob_children_18_to_23),
      jsonCell(a.ob_emergency_contacts), a.ob_beneficiary_name, a.ob_beneficiary_relationship, a.ob_beneficiary_contact,
      jsonCell(a.ob_tp3_data),
      a.ob_salary_company, a.ob_salary_bank, a.ob_salary_branch, a.ob_salary_account_no, a.ob_salary_ic_submitted,
      a.ob_personal_details_confirmed, dt(a.ob_personal_details_confirmed_at),
      a.ob_tp3_confirmed, dt(a.ob_tp3_confirmed_at),
      a.ob_salary_crediting_confirmed, dt(a.ob_salary_crediting_confirmed_at)
    ]);

    const csv = [headers, ...rows].map(row =>
      row.map(cell => `"${String(cell??'').replace(/"/g,'""')}"`).join(',')
    ).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    URL.revokeObjectURL(url);
}

let otherBuMatches = [];

let exitInterviewData = null; // this application's exit_interviews row, if any — fetched
// best-effort in openDetail() so the Exit Interview section can render whenever
// one exists, not just while status==='offboarding' (a later status change
// shouldn't hide historical exit interview data).

async function openDetail(id){
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_get_application', {p_token: adminToken, p_id: id});
    if(error) throw error;
    selectedApp = data[0];
    editingApp = false;

    // Best-effort extras — don't block opening the modal if either fails.
    try{
      const { data: obData } = await supabaseClient.rpc('rpc_admin_check_other_bu', { p_token: adminToken, p_id: id });
      otherBuMatches = obData || [];
    } catch(e){ otherBuMatches = []; }
    try{
      const { data: compData } = await supabaseClient.rpc('rpc_admin_list_companies', { p_token: adminToken });
      assignableCompanies = compData || [];
    } catch(e){ assignableCompanies = []; }
    try{
      const { data: eiData } = await supabaseClient.rpc('rpc_admin_get_exit_interview', { p_token: adminToken, p_application_id: id });
      exitInterviewData = (eiData && eiData[0]) || null;
    } catch(e){ exitInterviewData = null; }

    render();
  } catch(e){ alert('Error: '+e.message); }
}
function closeDetail(){
  selectedApp=null; editingApp=false;
  otherBuMatches = []; assignableCompanies = []; exitInterviewData = null;
  const existing = document.getElementById('modalRoot');
  if(existing) existing.remove();
  render();
}
function drow(k,v){ return `<div class="drow"><div class="k">${k}</div><div class="v">${esc(v)||'—'}</div></div>`; }

async function hrSignExitInterview(applicationId){
  const name = document.getElementById('hrSignName').value.trim();
  const position = document.getElementById('hrSignPosition').value.trim();
  const confirmed = document.getElementById('hrSignConfirm').checked;
  if(!name || !position){
    document.getElementById('hrSignErr').innerHTML = `<div class="error-banner">Name and position are both required.</div>`;
    return;
  }
  if(!confirmed){
    document.getElementById('hrSignErr').innerHTML = `<div class="error-banner">Please check the confirmation box to sign.</div>`;
    return;
  }
  if(!confirm('Sign this Exit Interview Form? This is final — the candidate will be emailed a link to their signed copy immediately.')) return;
  showLoading('Signing...');
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_sign_exit_interview', {
      p_token: adminToken, p_application_id: applicationId, p_hr_name: name, p_hr_position: position
    });
    if(error) throw error;
    exitInterviewData = data[0];
    await loadPendingExitSignatureCount();
    hideLoading();
    render();
  } catch(e){ hideLoading(); document.getElementById('hrSignErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

function exportExitInterviewPdf(applicationId){
  const a = applications.find(x=>x.id===applicationId) || selectedApp;
  const ei = exitInterviewData;
  if(!ei){ alert('No exit interview data loaded.'); return; }
  const html = buildExitInterviewPdfHtml(a, ei);
  const win = window.open('', '_blank');
  if(!win){ alert('Please allow pop-ups for this site to generate the PDF.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.onload = () => setTimeout(() => win.print(), 400);
}

// PERMISSION SETTINGS — All Units admin access only. Controls which of the
// three core business-unit scopes (E&C, Land, Mall) may assign candidates
// to companies in each entity category (E&C, Aviation, Hotel, Property,
// F&B, Malls, REIT), per the WCT company listing.
// ============================================================================
let permissionMatrix = []; // [{category, unit_scope, granted}, ...]
const PERMISSION_UNITS = ['E&C', 'Land', 'Mall'];

async function loadPermissionsForPage(){
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_get_permission_matrix', { p_token: adminToken });
    if(error) throw error;
    permissionMatrix = data || [];
  } catch(e){ alert('Error loading permissions: '+e.message); permissionMatrix = []; }
}

function permissionsPageView(){
  if(adminScope !== 'ALL'){
    return `<div class="empty-state">Permission Settings is only available to All Units admin access.</div>`;
  }
  const categories = [...new Set(permissionMatrix.map(r=>r.category))];
  const isGranted = (category, unit) => permissionMatrix.some(r=>r.category===category && r.unit_scope===unit && r.granted);

  return `
    <div class="stat-row">
      <div class="stat" style="flex:none;min-width:auto;">
        <h2 style="font-size:20px;margin:0;">Permission Settings</h2>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">Controls which business unit's admin team can assign candidates to companies in each entity category.</div>
      </div>
    </div>

    <table>
      <thead><tr>
        <th>Entity Category</th>
        ${PERMISSION_UNITS.map(u=>`<th style="text-align:center;">${u}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${categories.map(cat=>`
          <tr class="data-row">
            <td><strong>${esc(cat)}</strong></td>
            ${PERMISSION_UNITS.map(u=>`
              <td style="text-align:center;">
                <input type="checkbox" class="row-check" data-cat="${esc(cat)}" data-unit="${esc(u)}" ${isGranted(cat,u)?'checked':''} onchange="togglePermissionCheckbox(this)">
              </td>
            `).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div id="permissionsErr" style="margin-top:14px;"></div>
    <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="savePermissionChanges()">Save Changes</button>
  `;
}

let pendingPermissionChanges = {}; // unit_scope -> Set of categories, only populated once touched
function togglePermissionCheckbox(el){
  const unit = el.dataset.unit, cat = el.dataset.cat;
  // Track full desired category set per unit the first time that column is touched
  if(!pendingPermissionChanges[unit]){
    pendingPermissionChanges[unit] = new Set(
      permissionMatrix.filter(r=>r.unit_scope===unit && r.granted).map(r=>r.category)
    );
  }
  if(el.checked) pendingPermissionChanges[unit].add(cat);
  else pendingPermissionChanges[unit].delete(cat);
}

async function savePermissionChanges(){
  const units = Object.keys(pendingPermissionChanges);
  if(units.length === 0){ document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">No changes to save.</div>`; return; }
  showLoading('Saving permissions...');
  try{
    for(const unit of units){
      const categories = Array.from(pendingPermissionChanges[unit]);
      const { error } = await supabaseClient.rpc('rpc_admin_save_permissions', { p_token: adminToken, p_unit_scope: unit, p_categories: categories });
      if(error) throw error;
    }
    pendingPermissionChanges = {};
    await loadPermissionsForPage();
    hideLoading();
    render();
    document.getElementById('permissionsErr').innerHTML = `<div class="success-banner">Saved.</div>`;
  } catch(e){ hideLoading(); document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

// ============================================================================
// COMPANY SETTINGS — available to every admin scope (unlike Permission/
// Manager Settings, which are All Units only). A business-unit-scoped admin
// (E&C/Land/Mall) can add, edit, and delete companies belonging ONLY to
// their own business_unit; an All Units admin can manage every company
// across all three units. This is a straight ownership check on
// companies.business_unit — separate from, and simpler than, the
// category-based admin_unit_permissions grants used for candidate
// assignment (Permission Settings), which stays untouched by this feature.
// ============================================================================
let companyMgmtList = [];
let companyMgmtSearch = '';
let companyMgmtAddOpen = false;
let companyMgmtEditId = null;

async function loadCompanyMgmtList(){
  try{
    const { data, error } = await supabaseClient.rpc('rpc_admin_list_companies_for_management', { p_token: adminToken });
    if(error) throw error;
    companyMgmtList = data || [];
  } catch(e){ alert('Error loading companies: '+e.message); companyMgmtList = []; }
}

function filterCompanyMgmtList(v){
  companyMgmtSearch = v;
  renderCompanyMgmtResults();
}

function filteredCompanyMgmtList(){
  const q = companyMgmtSearch.trim().toLowerCase();
  if(!q) return companyMgmtList;
  return companyMgmtList.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.category||'').toLowerCase().includes(q) ||
    (c.business_unit||'').toLowerCase().includes(q)
  );
}

function companySettingsPageView(){
  const isAll = adminScope === 'ALL';
  return `
    <div class="stat-row">
      <div class="stat" style="flex:none;min-width:auto;">
        <h2 style="font-size:20px;margin:0;">Company Settings</h2>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">
          ${isAll
            ? 'Add, edit, or remove companies/entities across all business units. This list feeds the Company/Entity dropdown on each application.'
            : `Add, edit, or remove companies/entities under <strong>${esc(adminScope)}</strong>. This list feeds the Company/Entity dropdown on each application.`}
        </div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="companyMgmtSearchInput" placeholder="Search companies by name or category..." value="${esc(companyMgmtSearch)}" oninput="filterCompanyMgmtList(this.value)">
      <button class="btn btn-primary btn-sm" onclick="toggleAddCompanyForm()">${companyMgmtAddOpen ? 'Cancel' : '+ Add Company'}</button>
    </div>

    ${companyMgmtAddOpen ? addCompanyFormHtml() : ''}

    <div id="companyMgmtErr"></div>
    <div id="companyMgmtResults">${companyMgmtResultsHtml()}</div>
  `;
}

function addCompanyFormHtml(){
  const isAll = adminScope === 'ALL';
  const existingCategories = [...new Set(companyMgmtList.map(c=>c.category))];
  return `
    <div class="detail-section" style="background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);">
      <h4 style="border-top:none;padding-top:0;">New Company / Entity</h4>
      <div class="grid g3" style="display:grid;grid-template-columns:${isAll?'1fr 1fr 1fr':'1fr 1fr'};gap:14px;">
        <div class="field"><label>Name <span style="color:var(--danger);">*</span></label>
          <input type="text" id="newCompanyName" placeholder="e.g. WCT Berhad">
        </div>
        <div class="field"><label>Category <span style="color:var(--danger);">*</span></label>
          <input type="text" id="newCompanyCategory" list="companyCategoryOptions" placeholder="e.g. E&amp;C, Hotel, Malls...">
          <datalist id="companyCategoryOptions">${existingCategories.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        </div>
        ${isAll ? `
        <div class="field"><label>Business Unit <span style="color:var(--danger);">*</span></label>
          <select id="newCompanyBu" class="select-clean">
            <option value="E&C">E&amp;C</option>
            <option value="Land">Land</option>
            <option value="Mall">Mall</option>
          </select>
        </div>` : ''}
      </div>
      ${!isAll ? `<div class="hint" style="font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;">Will be added under your own business unit: <strong>${esc(adminScope)}</strong>.</div>` : ''}
      <button class="btn btn-primary btn-sm" onclick="submitAddCompany()">Save Company</button>
    </div>
  `;
}

function renderCompanySettingsShell(){
  // Toggling the Add-Company form (and closing it after a successful save)
  // changes the SHELL — the toolbar/button/form live outside
  // #companyMgmtResults — so the lighter renderCompanyMgmtResults() can't
  // pick it up. This forces a full shell rebuild for those cases, while
  // renderCompanyMgmtResults() stays the right tool for search/edit/refresh
  // (row-only changes that shouldn't touch the search input's focus).
  const root = document.getElementById('root');
  root.innerHTML = `<div class="wrap">${companySettingsPageView()}</div>`;
  lastRenderedView = 'companies';
}

function toggleAddCompanyForm(){
  companyMgmtAddOpen = !companyMgmtAddOpen;
  renderCompanySettingsShell();
}

async function submitAddCompany(){
  const name = document.getElementById('newCompanyName').value.trim();
  const category = document.getElementById('newCompanyCategory').value.trim();
  const buEl = document.getElementById('newCompanyBu');
  const business_unit = buEl ? buEl.value : adminScope;
  if(!name || !category){
    document.getElementById('companyMgmtErr').innerHTML = `<div class="error-banner">Name and category are both required.</div>`;
    return;
  }
  showLoading('Adding company...');
  try{
    const { error } = await supabaseClient.rpc('rpc_admin_create_company', { p_token: adminToken, p_name: name, p_category: category, p_business_unit: business_unit });
    if(error) throw error;
    companyMgmtAddOpen = false;
    await loadCompanyMgmtList();
    await loadCompanyLookup();
    hideLoading();
    renderCompanySettingsShell();
  } catch(e){ hideLoading(); document.getElementById('companyMgmtErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

function companyMgmtResultsHtml(){
  const isAll = adminScope === 'ALL';
  const list = filteredCompanyMgmtList();
  if(companyMgmtList.length === 0){
    return `<div class="empty-state">No companies yet${isAll ? '' : ` under ${esc(adminScope)}`}. Use "+ Add Company" above to create one.</div>`;
  }
  if(list.length === 0){
    return `<div class="empty-state">No companies match "${esc(companyMgmtSearch)}".</div>`;
  }
  return `
    <table>
      <thead><tr>
        <th>Name</th>
        <th>Category</th>
        ${isAll ? '<th>Business Unit</th>' : ''}
        <th style="width:1%;white-space:nowrap;">Actions</th>
      </tr></thead>
      <tbody>
        ${list.map(c => companyMgmtRowHtml(c, isAll)).join('')}
      </tbody>
    </table>
  `;
}

function companyMgmtRowHtml(c, isAll){
  if(companyMgmtEditId === c.id){
    return `
      <tr class="data-row">
        <td><input type="text" id="editCompanyName_${c.id}" value="${esc(c.name)}" style="width:100%;"></td>
        <td><input type="text" id="editCompanyCategory_${c.id}" value="${esc(c.category)}" style="width:100%;"></td>
        ${isAll ? `<td><span class="badge" style="background:var(--accent-tint);color:var(--accent-dark);">${esc(c.business_unit)}</span></td>` : ''}

          <div class="row-actions">
            <button class="btn btn-primary btn-sm" onclick="submitEditCompany('${c.id}')">Save</button>
            <button class="btn btn-outline btn-sm" onclick="cancelEditCompany()">Cancel</button>
          </div>
        </td>
      </tr>
    `;
  }
  return `
    <tr class="data-row">
      <td>${esc(c.name)}</td>
      <td>${esc(c.category)}</td>

        </div>
      </td>
    </tr>

function renderCompanyMgmtResults(){
  const el = document.getElementById('companyMgmtResults');
  if(el) el.innerHTML = companyMgmtResultsHtml();
}

function startEditCompany(id){
  companyMgmtEditId = id;
  renderCompanyMgmtResults();
}
function cancelEditCompany(){
  companyMgmtEditId = null;
  renderCompanyMgmtResults();
}

async function submitEditCompany(id){
  const name = document.getElementById('editCompanyName_'+id).value.trim();
  const category = document.getElementById('editCompanyCategory_'+id).value.trim();
  if(!name || !category){ alert('Name and category are both required.'); return; }
  showLoading('Saving...');
  try{
    const { error } = await supabaseClient.rpc('rpc_admin_update_company', { p_token: adminToken, p_id: id, p_name: name, p_category: category });
    if(error) throw error;
    companyMgmtEditId = null;
    await loadCompanyMgmtList();
    await loadCompanyLookup();
    hideLoading();
    render();
  } catch(e){ hideLoading(); alert('Error saving: '+e.message); }
}

async function deleteCompanyRow(id, name){
  if(!confirm(`Delete "${name}" from the company list? This cannot be undone, and will fail if any applications are currently assigned to it.`)) return;
  showLoading('Deleting...');
  try{
    const { error } = await supabaseClient.rpc('rpc_admin_delete_company', { p_token: adminToken, p_id: id });
    if(error) throw error;
    await loadCompanyMgmtList();
    await loadCompanyLookup();
    hideLoading();
    render();
  } catch(e){ hideLoading(); alert('Error deleting: '+e.message); }
}

async function saveCompanyAssignment(id){
  const companyId = document.getElementById('assignCompanySelect').value || null;
  try{
    const { error } = await supabaseClient.rpc('rpc_admin_assign_company', { p_token: adminToken, p_id: id, p_company_id: companyId });

    // Assign-and-close, rather than reopening the same modal — the person
    // already sees the updated Company column on the dashboard table

    closeDetail();
    await loadCompanyLookup();
    await loadApplications();

}

async function saveEdit(){
  const buEl = document.getElementById('editBusinessUnit');
  const patch = {
    name_nric: document.getElementById('editName').value.trim(),
    email: document.getElementById('editEmail').value.trim(),
    mobile_phone: document.getElementById('editMobile').value.trim(),
    position_applying: document.getElementById('editPosition').value.trim()
  };
  if(buEl) patch.business_unit = buEl.value; // only present for ALL-scope admins
  try{
    const { error } = await supabaseClient.rpc('rpc_admin_update_application', {p_token: adminToken, p_id: selectedApp.id, p_patch: patch});
    if(error) throw error;
    editingApp = false;
    await openDetail(selectedApp.id);
    await loadApplications();
  } catch(e){ alert('Error saving: '+e.message); }
}

async function updateStatus(status){
  const label = STATUS_LABELS[status] || status;
  const warnMsg = status === 'blacklisted'
    ? 'Blacklist this candidate? They will be signed out immediately and blocked from logging in or applying again using this email. This can be reversed later by changing their status.'
    : status === 'offboarding'
    ? `Move this application to "Offboarding"? The candidate will be prompted to complete their Exit Interview Form.`
    : `Change this application's status to "${label}"? The candidate will be notified by email.`;
  if(!confirm(warnMsg)) return;
  try{
    const rpcName = STATUS_VIA_DEDICATED_RPC[status] || 'rpc_admin_update_status';
    const params = STATUS_VIA_DEDICATED_RPC[status]
      ? { p_token: adminToken, p_id: selectedApp.id }
      : { p_token: adminToken, p_id: selectedApp.id, p_status: status };
    const { error } = await supabaseClient.rpc(rpcName, params);
    if(error) throw error;
    await openDetail(selectedApp.id);
    await Promise.all([loadApplications(), loadStats()]);

// ============================================================================
// ONBOARDING / STATUTORY DETAILS VIEW (post-hire forms)
// ============================================================================
let onboardingData = null;
let onboardingAppInfo = null; // basic application record (name/reference) for the onboarding
// modal's header + PDF export — deliberately kept separate from `selectedApp`,
// since that variable also controls whether the full detail modal re-opens
// on every render() and whether the 20s auto-refresh poll pauses. Reusing
// it here would silently pop open the detail modal and freeze the
// dashboard's auto-refresh any time someone views onboarding without
// having opened the detail modal first.

async function openOnboardingView(applicationId){
  try{
    const needsAppFetch = !(selectedApp && selectedApp.id === applicationId);
    const [obRes, appRes] = await Promise.all([
      supabaseClient.rpc('rpc_admin_get_onboarding', { p_token: adminToken, p_application_id: applicationId }),
      needsAppFetch
        ? supabaseClient.rpc('rpc_admin_get_application', { p_token: adminToken, p_id: applicationId })
        : Promise.resolve({ data: [selectedApp], error: null })
    ]);
    if(obRes.error) throw obRes.error;
    if(appRes.error) throw appRes.error;
    onboardingData = obRes.data[0];
    onboardingAppInfo = appRes.data[0];
    renderOnboardingModal();
  } catch(e){ alert('Error loading onboarding details: '+e.message); }
}
function closeOnboardingModal(){
  onboardingData = null;
  onboardingAppInfo = null;
  const existing = document.getElementById('onboardingModalRoot');
  if(existing) existing.remove();
}

function renderOnboardingModal(){
  const existing = document.getElementById('onboardingModalRoot');
  if(existing) existing.remove();
  const o = onboardingData;
  if(!o){
    alert('No onboarding record found for this candidate yet — they may not have started it.');
    return;
  }

  const div = document.createElement('div');
  div.id = 'onboardingModalRoot';
  div.className = 'modal-overlay';
  div.style.zIndex = '70';
  div.onclick = (e)=>{ if(e.target===div) closeOnboardingModal(); };
  div.innerHTML = `
    <div class="modal" style="max-width:760px;">
      <button class="modal-close" onclick="closeOnboardingModal()">✕</button>

function exportOnboardingPdf(){
  if(!onboardingData || !onboardingAppInfo){ alert('No onboarding data loaded.'); return; }
  const html = buildOnboardingPdfHtml(onboardingAppInfo, onboardingData);
  const win = window.open('', '_blank');
  if(!win){ alert('Please allow pop-ups for this site to generate the PDF.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.onload = () => setTimeout(() => win.print(), 400);
}

function fmt(v){ return (v===null||v===undefined||v==='') ? '—' : esc(String(v)); }

function fmtDateTime(v){ if(!v) return '—'; try{ return new Date(v).toLocaleString('en-GB'); }catch(e){ return esc(v); } }

async function exportCandidatePdf(id){

      if(error) throw error;

}

    <p><strong>Akses, Pembetulan, Siasatan dan/atau Aduan.</strong> Anda berhak untuk meminta akses kepada Data anda dan untuk meminta untuk mengemaskini atau membetulkan Data anda. Sila hubungi Pengurus Hal Ehwal Korporat di 03-7806688 atau menghantar e-mel kepada pdpa@wct.my.</p>

    <p><strong>Pemindahan data peribadi ke tempat di luar Malaysia.</strong> Kami boleh memindahkan Data anda ke tempat di luar Malaysia dan dengan ini anda telahpun bersetuju terhadap pemindahan tersebut.</p>
  ` : `
    <p>This Notice is issued to you by and/or on behalf of WCT Holdings Berhad, its related companies*, affiliates and other entities within the WCT group of companies (hereinafter referred to as "WCT Group") pursuant to the Personal Data Protection Act 2010. In this notice "we", "our" and "us" refer to any of the companies within the WCT Group.</p>
    <p><strong>Source and Description of Personal Data.</strong> We have collected and/or will be collecting personal data as disclosed by / collected from you which, depending on the purpose for which you disclosed the data, may include your personal details (e.g. name, date of birth, gender, race, NRIC / passport no., marital status, nationality), your contact information as well as your educational, professional, occupational, financial, familial, medical details, biometric data and/or any other information which you may provide to us.</p>

    <p><strong>Access, Correction, Inquiry and/or Complaint.</strong> You have the right to request for access to your Data and to request to update or correct the same. Please contact the Corporate Affairs Manager at 03-78066688 or email us at pdpa@wct.my.</p>
    <p><strong>Consent and Choice.</strong> Save for Data necessary for the performance of contracts between us, you may choose whether or not to provide your Data. If you wish to withdraw or limit your consent, please complete the Withdrawal Form on our website at www.wct.com.my/pdpa.</p>

// ============================================================================
// BOOT
// ============================================================================
// Deep link from an email — admin.html?app=<application id> opens straight
// into that application's detail modal (e.g. "an employee has submitted
// their Exit Interview — click to review and sign") instead of the generic
// dashboard. Same idea as index.html's ?onboarding=/?exit= links. Stripped
// from the URL immediately so refreshing afterward doesn't keep re-opening
// the same modal, and consumed once whichever of boot-with-existing-session
// or doLogin() runs first actually has a token to fetch with.
let deepLinkAppId = new URLSearchParams(window.location.search).get('app');
if(deepLinkAppId) window.history.replaceState({}, '', window.location.pathname);
async function openDeepLinkedAppIfAny(){
  if(!deepLinkAppId) return;
  const id = deepLinkAppId;
  deepLinkAppId = null;
  await openDetail(id);
}

if(adminToken && adminScope && adminScope !== 'ALL') filterBusinessUnit = adminScope;
render();
if(adminToken) loadEverything().then(openDeepLinkedAppIfAny);

// ============================================================================
// AUTO-REFRESH — polls every 20 seconds while on the Home view, so new
// submissions and status changes appear without needing a manual refresh.
// (True push-based Supabase Realtime isn't used here since it requires RLS
// policies permitting SELECT access, which would undo the locked-down
// table access this whole system was deliberately built around — polling
// gets the same practical result without that tradeoff.)
// ============================================================================
setInterval(() => {
  if(adminToken && currentView === 'home' && !selectedApp){
    loadApplications();
    loadStats();
    loadPendingExitSignatureCount().then(renderDashboardResults);
  }
}, 20000);
</script>
</body>
</html>
