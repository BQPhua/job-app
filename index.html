<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCT Group — Employment Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#000000;
    --navy-2:#262626;
    --gold:#ED1C24;
    --gold-light:#C4151B;
    --cream:#F7F7F6;
    --paper:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#6E6E6D;
    --line:#E4E4E3;
    --danger:#B3423A;
    --ok:#3D7A5C;
    --radius:10px;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);line-height:1.5;}
  h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:700;color:var(--navy);margin:0 0 .3em;}
  .topbar{background:var(--navy);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:700;color:var(--navy);font-size:18px;}
  .brand-text .name{font-weight:700;font-size:19px;letter-spacing:.02em;}
  .brand-text .sub{font-size:12.5px;color:#C9D3DE;}
  .topbar .ref{font-size:13px;color:#C9D3DE;}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}
  .progress{display:flex;gap:4px;margin-bottom:26px;flex-wrap:wrap;}
  .progress .seg{flex:1;min-width:14px;height:5px;border-radius:3px;background:var(--line);}
  .progress .seg.done{background:var(--gold);}
  .progress .seg.active{background:var(--navy-2);}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:32px;box-shadow:0 1px 3px rgba(18,37,63,.04);}
  .step-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:600;margin-bottom:6px;}
  .step-desc{color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid.g1{grid-template-columns:1fr;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:640px){.grid,.grid.g3{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-size:13px;font-weight:600;color:var(--navy);}
  .field .opt-tag{font-weight:400;color:var(--ink-soft);font-size:12px;}
  .req-star{color:var(--danger);}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{
    font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD3DB;border-radius:7px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{min-height:70px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);outline-offset:1px;border-color:var(--gold);}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 16px;}
  legend{font-size:13px;font-weight:600;color:var(--navy);padding:0 6px;}
  .radio-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .radio-opt{display:flex;align-items:center;gap:6px;font-size:14px;}
  .section-title{font-size:16px;font-weight:700;color:var(--navy);margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line);}
  .section-title:first-child{border-top:none;padding-top:0;margin-top:0;}
  table.dyn{width:100%;border-collapse:collapse;margin-bottom:10px;}
  table.dyn th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.dyn td{padding:6px 8px;vertical-align:top;}
  table.dyn input,table.dyn select{font-size:13px;padding:7px 8px;}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:7px;border:none;cursor:pointer;transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);}
  .btn-ghost:hover{background:#eef1f5;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger);font-size:13px;padding:6px 12px;}
  .btn-row{display:flex;justify-content:space-between;margin-top:28px;gap:10px;}
  .btn-row .right{display:flex;gap:10px;}
  .add-row-btn{font-size:13px;background:#eef1f5;color:var(--navy);border:1px dashed #A9B6C4;border-radius:7px;padding:8px 14px;cursor:pointer;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .error-banner{background:#FBEAE8;border:1px solid #EBBAB4;color:var(--danger);padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:18px;}
  .success-banner{background:#EAF3EC;border:1px solid #BEDACB;color:var(--ok);padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:18px;}
  .toggle-tabs{display:flex;gap:8px;margin-bottom:24px;}
  .toggle-tabs button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .toggle-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .upload-box{border:2px dashed #C7D0D9;border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#FBFAF7;}
  .upload-box:hover{border-color:var(--gold);}
  .profile-preview{width:140px;height:140px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block;margin:0 auto 12px;background:#eee;}
  .attach-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .attach-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#FBFAF7;}
  .draft-banner{display:flex;align-items:center;gap:14px;border:1px solid #E2D3AC;background:#FBF6EA;border-radius:9px;padding:14px 16px;margin-bottom:10px;}
  .draft-banner-icon{font-size:22px;}
  .draft-banner-body{flex:1;min-width:0;}
  .draft-banner-title{font-weight:700;font-size:14px;color:var(--ink);}
  .draft-banner-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .history-table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px;}
  .history-table th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .history-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .history-table tr:last-child td{border-bottom:none;}
  .history-table tr:hover td{background:#FAFAF9;}
  .status-badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .status-badge.submitted{background:#EAF0FB;color:#2E5AAC;}
  .status-badge.under_review{background:#FDF3E3;color:#B9770E;}
  .status-badge.shortlisted{background:#E7F5EC;color:#1E7A46;}
  .status-badge.interview_scheduled{background:#EEE8FB;color:#6A3FC0;}
  .status-badge.offer_sent{background:#FCEFE0;color:#B9660E;}
  .status-badge.rejected{background:#FBEAE8;color:#C0392B;}
  .status-badge.hired{background:#0A0A0A;color:#fff;}
  .status-badge.withdrawn{background:#EDEDEC;color:#6B6D70;}
  .status-badge.blacklisted{background:#1a1a1a;color:#fff;}
  .file-thumb-row{display:flex;align-items:center;gap:12px;padding:6px 0;}
  .file-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#EFEEEA;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--line);}
  .profile-thumb-lg{width:72px;height:72px;border-radius:9px;object-fit:cover;border:1px solid var(--line);}
  .attach-thumb{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#e2e6ea;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .attach-name{font-size:13px;flex:1;word-break:break-all;}
  .remove-x{cursor:pointer;color:var(--danger);font-size:13px;font-weight:600;background:none;border:none;}
  .review-block{margin-bottom:18px;}
  .review-block h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .review-block h4 .edit-link{font-size:12px;color:var(--navy-2);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;}
  .review-row{display:flex;font-size:13.5px;padding:4px 0;border-bottom:1px dashed #ECE7DB;}
  .review-row .k{width:44%;color:var(--ink-soft);}
  .review-row .v{width:56%;font-weight:500;}
  .consent-doc{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:#FBFAF7;font-size:13px;line-height:1.6;margin-bottom:18px;}
  .consent-doc p{margin:0 0 10px;}
  .consent-doc strong{color:var(--navy);}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;background:#FDEDEC;border:1px solid #F3C6C4;border-radius:8px;padding:14px;margin-bottom:16px;}
  .checkbox-row input{margin-top:3px;}
  .lang-choice{display:flex;gap:14px;}
  .lang-choice .opt{flex:1;border:2px solid var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;font-weight:700;color:var(--navy);}
  .lang-choice .opt.selected{border-color:var(--gold);background:#FDEDEC;}
  .thankyou{text-align:center;padding:50px 20px;}
  .thankyou .ref-box{display:inline-block;background:var(--navy);color:#fff;padding:14px 26px;border-radius:8px;font-family:'Source Serif 4',serif;font-size:20px;font-weight:700;letter-spacing:.03em;margin:16px 0;}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:26px;}
  a{color:var(--navy-2);}
  .link-btn{background:none;border:none;color:var(--navy-2);text-decoration:underline;cursor:pointer;font-size:13px;font-family:inherit;padding:0;}
  .loading-overlay{position:fixed;inset:0;background:rgba(18,37,63,.55);display:flex;align-items:center;justify-content:center;z-index:99;color:#fff;font-weight:600;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img class="wct-logo-img" alt="WCT Group" style="height:58px;image-rendering:-webkit-optimize-contrast;">
    <div class="brand-text">
      <div class="sub" style="font-size:15px;font-weight:600;color:#fff;">WCT Employment Application Portal</div>
    </div>
  </div>
  <div class="ref" id="topRefDisplay"></div>
</div>

<div class="wrap">
  <div class="progress" id="progressBar"></div>
  <div class="card" id="cardRoot">
    <!-- rendered by JS -->
  </div>
  <div class="footer-note">Your data is processed in accordance with the WCT Group Personal Data Protection Notice. Questions? Contact your HR representative.</div>
</div>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <div id="loadingText">Saving...</div>
  </div>
</div>

<script src="config.js"></script>
<script src="logo.js"></script>
<script>document.querySelectorAll('.wct-logo-img').forEach(el=>el.src=WCT_LOGO_DATA_URI);</script>
<script src="consent-text.js"></script>
<script src="app.js"></script>
</body>
</html>
