<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCT Group — Employment Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B2D;
    --navy-2:#1C2C44;
    --accent:#3E5C76;
    --accent-dark:#2C4356;
    --accent-tint:#EAF0F5;
    --cream:#F7F7F6;
    --paper:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#6E6E6D;
    --line:#E4E4E3;
    --danger:#B3423A;
    --ok:#3D7A5C;
    --radius:10px;
    font-family:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);line-height:1.5;}
  h1,h2,h3{font-family:'Lexend',sans-serif;font-weight:700;color:var(--navy);margin:0 0 .3em;}
  .topbar{background:var(--navy);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--accent-dark),var(--accent));display:flex;align-items:center;justify-content:center;font-family:'Lexend',sans-serif;font-weight:700;color:var(--navy);font-size:18px;}
  .brand-text .name{font-weight:700;font-size:19px;letter-spacing:.02em;}
  .brand-text .sub{font-size:12.5px;color:#C9D3DE;}
  .topbar .ref{font-size:13px;color:#C9D3DE;}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}
  .progress{margin-bottom:22px;}
  .progress:empty{display:none;}
  .progress-caption{font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
  .progress-caption strong{color:var(--navy);font-weight:600;}
  .progress-segs{display:flex;gap:4px;}
  /* Each step is a 28px-tall target with a 5px bar; completed steps can be clicked. */
  .progress .pstep{flex:1;min-width:14px;height:28px;margin:-11px 0;padding:0;border:0;background:none;position:relative;display:block;}
  .progress .pstep::before{content:"";position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;background:var(--line);transition:height .15s ease,margin .15s ease,background-color .15s ease;}
  .progress .pstep.done::before{background:var(--wct-navy, #0F172A);}
  .progress .pstep.active::before{background:var(--wct-red, #D7141A);}
  .progress button.pstep{cursor:pointer;}
  .progress button.pstep:hover::before,.progress button.pstep:focus-visible::before{height:9px;margin-top:-4.5px;}
  .progress button.pstep:not(.done)::before{background:#CBD5E1;}
  .progress button.pstep:focus-visible{outline:2px solid var(--wct-blue, #0369A1);outline-offset:2px;border-radius:4px;}
  .progress-tip{color:var(--ink-soft);}
  @media (max-width:560px){ .progress-tip{display:none;} }
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:32px;box-shadow:0 1px 3px rgba(18,37,63,.04);}
  .step-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .step-desc{color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid.g1{grid-template-columns:1fr;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:640px){.grid,.grid.g3{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-size:13px;font-weight:600;color:var(--navy);}
  .field .opt-tag{font-weight:400;color:var(--ink-soft);font-size:12px;}
  .req-star{color:var(--danger);}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{
    font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD3DB;border-radius:7px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{min-height:70px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-dark);outline-offset:1px;border-color:var(--accent);}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 16px;}
  legend{font-size:13px;font-weight:600;color:var(--navy);padding:0 6px;}
  .radio-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .radio-opt{display:flex;align-items:center;gap:6px;font-size:14px;}
  .section-title{font-size:16px;font-weight:700;color:var(--navy);margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line);}
  .section-title:first-child{border-top:none;padding-top:0;margin-top:0;}
  /* Education/other dynamic-row tables have enough columns (Type, Institution,
     From, To, Qualification, Course Name, remove-✕) that their combined
     natural width can exceed the card even on a normal desktop viewport —
     not just the <640px case this used to be handled for below — pushing
     the last column(s) (Course Name, the ✕ button) out past the card's
     right edge instead of wrapping or squeezing. Scoping the scroll to the
     table itself (rather than resizing columns down further, which was
     already fairly tight) keeps every column comfortably usable and just
     lets the admin scroll the row horizontally when needed. */
  table.dyn{width:100%;border-collapse:collapse;margin-bottom:10px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
  table.dyn th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.dyn td{padding:6px 8px;vertical-align:top;}
  table.dyn input,table.dyn select{font-size:13px;padding:7px 8px;}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:7px;border:none;cursor:pointer;transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);}
  .btn-ghost:hover{background:#eef1f5;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger);font-size:13px;padding:6px 12px;}
  .btn-row{display:flex;justify-content:space-between;margin-top:28px;gap:10px;}
  .btn-row .right{display:flex;gap:10px;}
  .add-row-btn{font-size:13px;background:#eef1f5;color:var(--navy);border:1px dashed #A9B6C4;border-radius:7px;padding:8px 14px;cursor:pointer;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .error-banner{background:#FBEAE8;border:1px solid #EBBAB4;color:var(--danger);padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:18px;}
  /* Required-field highlight: a field/fieldset gets .invalid added when it fails
     validation on Next/Submit, and it's removed automatically the moment the
     person edits anything inside it (see the delegated input/change listener
     in app.js). Uses box-shadow (not border/margin) so nothing reflows. */
  .field.invalid{box-shadow:-3px 0 0 var(--danger);padding-left:10px;}
  .field.invalid>label{color:var(--danger);}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);background:#FFF6F5;}
  fieldset.invalid{box-shadow:-3px 0 0 var(--danger);}
  fieldset.invalid>legend{color:var(--danger);}
  input.invalid,select.invalid,textarea.invalid{border-color:var(--danger) !important;background:#FFF6F5;}
  .upload-box.invalid{border-color:var(--danger);background:#FFF6F5;}
  td.invalid input,td.invalid select{border-color:var(--danger) !important;background:#FFF6F5;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll > table{min-width:760px;}
  .lang-fixed{font-weight:700;padding:10px 12px;background:var(--cream);border:1px solid var(--line);border-radius:7px;white-space:nowrap;}
  .lang-table td:first-child{width:42%;}
  .no-exp{display:flex;gap:12px;align-items:flex-start;border:1px solid #BAE6FD;background:#F0F9FF;border-radius:12px;padding:14px 16px;margin:0 0 18px;font-size:15px;line-height:1.5;cursor:pointer;}
  .no-exp input{width:22px;height:22px;margin-top:1px;accent-color:var(--navy);flex:none;}
  .decl-text{font-size:13.5px;line-height:1.6;font-weight:700;color:var(--ink);}
  /* Small, inline, non-blocking message under an upload box or field — used
     instead of a native alert() popup so it can't cover or shift other
     controls on the page. */
  .inline-error{background:#FBEAE8;border:1px solid #EBBAB4;color:var(--danger);padding:8px 12px;border-radius:7px;font-size:12.5px;margin-top:8px;line-height:1.5;}
  .edu-list{display:grid;gap:12px;margin:0 0 12px;}
  .edu-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px 4px;background:#fff;}
  .edu-card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .edu-card-h .edu-type{width:auto;min-width:200px;font-weight:700;color:var(--navy);}
  .edu-remove{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--danger);font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px;}
  .edu-remove:hover{background:#FEF2F2;border-color:#FECACA;}
  .edu-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 12px;}
  .edu-grid > .field:nth-child(4){grid-column:1 / 2;}
  .edu-grid > .field:nth-child(5){grid-column:2 / 4;}
  @media (max-width:640px){ .edu-grid{grid-template-columns:1fr 1fr;} .edu-grid .edu-wide{grid-column:1 / -1;} .edu-grid > .field:nth-child(4), .edu-grid > .field:nth-child(5){grid-column:1 / -1;} .edu-card-h .edu-type{min-width:0;flex:1;} }
  .info-banner{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A;padding:10px 14px;border-radius:7px;font-size:13.5px;line-height:1.5;margin:0 0 16px;}
  .success-banner{background:#EAF3EC;border:1px solid #BEDACB;color:var(--ok);padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:18px;}
  .toggle-tabs{display:flex;gap:8px;margin-bottom:24px;}
  .toggle-tabs button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .toggle-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .upload-box{border:2px dashed #C7D0D9;border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#FBFAF7;}
  .upload-box:hover{border-color:var(--accent);}
  .profile-preview{width:140px;height:140px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block;margin:0 auto 12px;background:#eee;}
  .attach-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .attach-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#FBFAF7;}
  .draft-banner{display:flex;align-items:center;gap:14px;border:1px solid #E2D3AC;background:#FBF6EA;border-radius:9px;padding:14px 16px;margin-bottom:10px;}
  .draft-banner-icon{font-size:22px;}
  .draft-banner-body{flex:1;min-width:0;}
  .draft-banner-title{font-weight:700;font-size:14px;color:var(--ink);}
  .draft-banner-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .history-table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px;}
  .history-table th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .history-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .history-table tr:last-child td{border-bottom:none;}
  .history-table tr:hover td{background:#FAFAF9;}
  .history-actions{display:flex;flex-direction:column;gap:6px;}
  .history-actions .btn{width:100%;justify-content:center;}
  .file-thumb-row{display:flex;align-items:center;gap:12px;padding:6px 0;}
  .file-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#EFEEEA;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--line);}
  .profile-thumb-lg{width:72px;height:72px;border-radius:9px;object-fit:cover;border:1px solid var(--line);}
  .attach-thumb{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#e2e6ea;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .attach-name{font-size:13px;flex:1;word-break:break-all;}
  .remove-x{cursor:pointer;color:var(--danger);font-size:13px;font-weight:600;background:none;border:1px solid transparent;border-radius:7px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;}
  .remove-x:hover{background:#FBEAE8;border-color:#EBBAB4;}
  .draft-banner-icon{color:#9C7A0E;display:flex;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;}
  .btn-ghost svg,.btn-primary svg{flex:none;}
  /* Mobile: keep Back / Next within thumb reach on long form steps. */
  @media(max-width:640px){
    .card > .btn-row:last-child{position:sticky;bottom:0;background:var(--paper);margin:24px -16px -20px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(16,27,45,.06);z-index:5;}
    /* One compact row in the pinned bar: Back | Save & Exit | Next. */
    .card > .btn-row:last-child{flex-direction:row;align-items:stretch;gap:8px;}
    .card > .btn-row:last-child > .btn{flex:0 0 auto;width:auto;padding:10px 14px;}
    .card > .btn-row:last-child .right{flex-direction:row;flex:1;width:auto;gap:8px;}
    .card > .btn-row:last-child .right .btn{flex:1;padding:10px 12px;font-size:14px;}
  }
  .review-block{margin-bottom:18px;}
  .review-block h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .review-block h4 .edit-link{font:inherit;font-size:12px;color:var(--navy-2);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;background:none;border:0;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;}
  .review-row{display:flex;font-size:13.5px;padding:4px 0;border-bottom:1px dashed #ECE7DB;}
  .review-row .k{width:44%;color:var(--ink-soft);}
  .review-row .v{width:56%;font-weight:500;}
  .consent-doc{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:#FBFAF7;font-size:13px;line-height:1.6;margin-bottom:18px;}
  .consent-doc p{margin:0 0 10px;}
  .consent-doc strong{color:var(--navy);}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;background:#FDEDEC;border:1px solid #F3C6C4;border-radius:8px;padding:14px;margin-bottom:16px;}
  .checkbox-row input{margin-top:3px;}
  .lang-choice{display:flex;gap:14px;}
  .lang-choice .opt{flex:1;border:2px solid var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;font-weight:700;color:var(--navy);}
  .lang-choice .opt.selected{border-color:var(--accent);background:var(--accent-tint);}
  .thankyou{text-align:center;padding:50px 20px;}
  .thankyou .ref-box{display:inline-block;background:var(--navy);color:#fff;padding:14px 26px;border-radius:8px;font-family:'Lexend',sans-serif;font-size:20px;font-weight:700;letter-spacing:.03em;margin:16px 0;}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:26px;}
  a{color:var(--navy-2);}
  .link-btn{background:none;border:none;color:var(--navy-2);text-decoration:underline;cursor:pointer;font-size:13px;font-family:inherit;padding:0;}
  .loading-overlay{position:fixed;inset:0;background:rgba(18,37,63,.55);display:flex;align-items:center;justify-content:center;z-index:99;color:#fff;font-weight:600;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ==========================================================================
     MOBILE — everything below only applies at narrow widths and only ADDS
     or overrides spacing/layout, never removes a desktop rule, so nothing
     above this block changes on desktop.
     ========================================================================== */
  @media(max-width:640px){
    .topbar{padding:12px 16px;flex-wrap:wrap;row-gap:8px;}
    .topbar .brand{gap:10px;}
    .topbar img.wct-logo-img{height:36px !important;}
    .brand-text .name{font-size:14px;}
    .brand-text .sub{font-size:11px;}
    .topbar .ref{font-size:11.5px;}

    .wrap{padding:16px 12px 60px;}
    .card{padding:20px 16px;}

    .step-desc{font-size:13px;}

    /* Form action rows: stacking full-width buttons is far easier to tap
       than squeezed inline buttons, and avoids horizontal overflow when a
       "← Back to My Applications"-length label sits next to "Next →". */
    .btn-row{flex-direction:column-reverse;align-items:stretch;gap:10px;}
    .btn-row .right{flex-direction:column-reverse;width:100%;gap:10px;}
    .btn-row .btn{width:100%;text-align:center;justify-content:center;}

    .lang-choice{flex-direction:column;}

    .draft-banner{flex-wrap:wrap;}
    .draft-banner-actions{width:100%;}
    .draft-banner-actions .btn{flex:1;}

    /* Data tables (application history) are the one thing that genuinely
       can't reflow to a single column without a much bigger template
       rewrite — so let them scroll horizontally instead of squashing or
       breaking the layout. (table.dyn now gets the same overflow-x:auto
       treatment unconditionally — see its base rule above — since it could
       overflow the card even above this breakpoint.) */
    .history-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
    .history-actions{width:140px;white-space:normal;}

    .review-row{flex-direction:column;padding:8px 0;}
    .review-row .k,.review-row .v{width:100%;}
    .review-row .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}

    .thankyou{padding:36px 12px;}
    .thankyou .ref-box{font-size:16px;padding:10px 18px;}

    .toggle-tabs{flex-wrap:wrap;}
  }
</style>
<link rel="stylesheet" href="offboarding-employee.css">
<link rel="stylesheet" href="ui-refresh.css">
<link rel="stylesheet" href="wct-theme.css">
<link rel="stylesheet" href="wct-motion.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img class="wct-mark-img" alt="WCT Group">
    <div class="brand-text">
      <div class="name" style="font-size:15px;font-weight:700;color:#fff;letter-spacing:.01em;">WCT <span style="color:#FCA5A5;font-weight:400;">|</span> Building Values</div>
      <div class="sub" style="font-size:12.5px;font-weight:500;color:#B9C4D0;">Employment Application Portal</div>
    </div>
  </div>
  <div class="ref" id="topRefDisplay"></div>
</div>

<div class="wrap">
  <div class="progress" id="progressBar"></div>
  <div class="card" id="cardRoot">
    <!-- rendered by JS -->
  </div>
  <div class="footer-note">Your data is processed in accordance with the WCT Group Personal Data Protection Notice. For enquiries, please contact your HR Representative.</div>
</div>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <div id="loadingText">Saving...</div>
  </div>
</div>
<script>
  // Where the API lives: on the live server (nginx) it is on the same address
  // under /api; local development (localhost) falls back to api.js's :3000.
  (function () {
    var h = location.hostname;
    if (h !== "localhost" && h !== "127.0.0.1") window.API_BASE_URL = location.origin + "/api";
  })();
</script>
<script src="ui-a11y.js"></script>
<script src="wct-experience.js"></script>
<script src="candidate-experience.js"></script>
<script src="api.js"></script>
<script src="logo.js"></script>
<script>document.querySelectorAll('.wct-logo-img').forEach(el=>el.src=WCT_LOGO_DATA_URI);document.querySelectorAll('.wct-mark-img').forEach(el=>el.src=WCT_MARK_DATA_URI);</script>
<script src="wct-shared.js"></script>
<script src="consent-text.js"></script>
<script src="offboarding-employee.js"></script>
<script src="app.js"></script>
</body>
</html>
